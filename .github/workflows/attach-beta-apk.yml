name: Attach PanelFlow beta APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/attach-beta-apk.yml

permissions: {}

jobs:
  attach-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach signed APK to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.6.2-beta releases/panelflow-0.6.2-beta.apk --clobber
